[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostscope"
version = "1.0.0"
description = "Scope-aware topology, distance and competing-network audits for ghost introgression"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.scripts]
ghostscope = "ghostscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghostscope = ["data/*.json", "data/demo_bundle/*"]
